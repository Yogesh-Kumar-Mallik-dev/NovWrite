[package]
name = "novwrite-desktop"
version = "1.0.0"
description = "NovWrite Native Desktop Authoring Studio"
authors = ["NovWrite Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "novwrite_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
